<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nft pic market</title>
<script src="https://staticgram.top/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#222632;--tx:#fff;--mu:#8b93a7;--ac:#3b82f6;--st:#fbbf24;--ok:#22c55e;--err:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f8;--card:#fff;--card2:#e8eaf1;--tx:#111;--mu:#6b7280;color-scheme:light}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:30px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.logo{font-weight:800;font-size:18px}
.right{display:flex;align-items:center;gap:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.pill{background:var(--card);padding:8px 12px;border-radius:12px;font-weight:600}
.pill.bal{color:var(--st)}
.btn{background:var(--ac);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;width:100%}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.sm{padding:8px 10px;font-size:13px}
.tabs{display:flex;gap:6px;padding:4px 14px 12px}
.tab{flex:1;background:var(--card);padding:10px;border-radius:12px;font-weight:700;color:var(--mu)}
.tab.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card2)}
.info{padding:9px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;width:fit-content}
.r-Обычная{background:#64748b33;color:#94a3b8}.r-Редкая{background:#3b82f633;color:#60a5fa}.r-Эпическая{background:#a855f733;color:#c084fc}.r-Легендарная{background:#fbbf2433;color:#fbbf24}
.card .btn{margin:0 10px 10px;width:auto}
.empty{text-align:center;color:var(--mu);padding:40px 20px;grid-column:1/-1}
.row{background:var(--card);margin:0 14px 8px;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prof{display:flex;align-items:center;gap:12px;background:var(--card);margin:0 14px 12px;padding:14px;border-radius:16px}
.ava{width:60px;height:60px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;overflow:hidden;flex-shrink:0}
.ava img{width:100%;height:100%;object-fit:cover}
.prof .bl{margin-left:auto;color:var(--st);font-weight:800;font-size:17px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
input,select{background:var(--card2);color:var(--tx);border:0;border-radius:12px;padding:12px;font:inherit;width:100%}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600}
.fab{margin:0 14px 12px}
</style>
</head>
<body>
<header>
  <div class="logo">Nft pic market</div>
  <div class="right"><button class="pill" id="profBtn">Профиль</button><button class="pill bal" id="bal"></button></div>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="hide"></div>

<script>
// ---------- Пользователь (Telegram или демо) ----------
const OWNER = "marvel"; // единственный, кто может создавать новые NFT
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
// Чтение профиля: подходит и для кастомных клиентов (разные способы передачи данных)
function parseUserFrom(str){
  try {
    const p = new URLSearchParams(str);
    let raw = p.get("user");
    const d = p.get("tgWebAppData");
    if (!raw && d) raw = new URLSearchParams(d).get("user");
    if (raw) return JSON.parse(raw);
    if (p.get("username") || p.get("first_name")) // запасной вариант: параметры прямо в ссылке
      return { id: p.get("id"), username: p.get("username"), first_name: p.get("first_name"), last_name: p.get("last_name"), photo_url: p.get("photo_url") };
  } catch(e){}
  return null;
}
function readUser(){
  let u = null;
  try { u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; } catch(e){}
  if (!u) try { if (tg && tg.initData) u = parseUserFrom(tg.initData); } catch(e){}
  if (!u) try { const ip = window.Telegram && Telegram.WebView && Telegram.WebView.initParams; if (ip) u = parseUserFrom("tgWebAppData=" + encodeURIComponent(ip.tgWebAppData||"")); } catch(e){}
  if (!u) u = parseUserFrom(location.hash.slice(1)) || parseUserFrom(location.search.slice(1));
  try {
    if (u) sessionStorage.setItem("npm_user", JSON.stringify(u));
    else { const s = sessionStorage.getItem("npm_user"); if (s) u = JSON.parse(s); }
  } catch(e){}
  if (u && u.username) u.username = String(u.username).replace("@","");
  return u;
}
let tgUser = readUser();
let me = tgUser ? { username: (tgUser.username||("id"+tgUser.id)).toLowerCase(), name: [tgUser.first_name,tgUser.last_name].filter(Boolean).join(" "), photo: tgUser.photo_url }
                : { username: "guest", name: "Гость (демо)", photo: null };

// ---------- Хранилище ----------
let S = { items: [], deals: [], users: {} };
try { const raw = localStorage.getItem("npm_state"); if (raw) S = JSON.parse(raw); } catch(e){}
function save(){ try { localStorage.setItem("npm_state", JSON.stringify(S)); } catch(e){ toast("Память заполнена"); } }
let ext = null; // баланс из клиента (null = клиент баланс не передал)
function bal(){ if (S.users[me.username]==null) S.users[me.username]=0; return S.users[me.username]; }
const RAR = ["Обычная","Редкая","Эпическая","Легендарная"];
const isOwner = () => me.username === OWNER;

// ---------- UI ----------
let view = "main", mainTab = "catalog", profTab = "assets", colFilter = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t,ms){ const e=$("#toast"); e.textContent=t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.add("hide"),ms||2200); }

function card(it, mode){
  const act = mode==="shop" ? (it.owner===me.username ? `<div class="mu" style="padding:0 10px 10px">Ваш лот</div>` : `<button class="btn sm" data-buy="${it.id}">Купить</button>`)
    : (it.price!=null ? `<button class="btn sm sec" data-unlist="${it.id}">Снять с продажи</button>` : `<button class="btn sm" data-sell="${it.id}">Продать</button>`);
  const price = it.price!=null ? `<div style="color:var(--st);font-weight:700">${it.price} ⭐</div>` : `<div class="mu">Не продаётся</div>`;
  return `<div class="card"><img src="${it.img}" alt=""><div class="info"><div class="nm">${esc(it.name)} #${esc(it.number)}</div><div class="mu">${esc(it.collection)}</div><span class="badge r-${it.rarity}">${it.rarity}</span>${price}</div>${act}</div>`;
}

function render(){
  $("#bal").textContent = bal() + " ⭐ ＋";
  $("#profBtn").textContent = view==="profile" ? "← Назад" : "Профиль";
  const app = $("#app");
  if (view==="profile") return app.innerHTML = renderProfile();
  const tabs = `<div class="tabs"><button class="tab ${mainTab==="catalog"?"on":""}" data-mt="catalog">Каталог</button><button class="tab ${mainTab==="cols"?"on":""}" data-mt="cols">Коллекции</button></div>`;
  const add = isOwner() ? `<div class="fab"><button class="btn" id="addNft">+ Добавить NFT</button></div>` : "";
  let body;
  if (mainTab==="catalog") {
    let list = S.items.filter(i=>i.price!=null && (!colFilter || i.collection===colFilter));
    const flt = colFilter ? `<div class="row"><span>Коллекция: <b>${esc(colFilter)}</b></span><button class="btn sm sec" style="width:auto" id="clr">Сбросить</button></div>` : "";
    body = flt + `<div class="grid">${list.map(i=>card(i,"shop")).join("") || `<div class="empty">Пока нет предметов на продаже</div>`}</div>`;
  } else {
    const cols = {}; S.items.forEach(i=>{ (cols[i.collection] ||= {n:0,f:0,img:i.img}); cols[i.collection].n++; if(i.price!=null) cols[i.collection].f++; });
    const keys = Object.keys(cols);
    body = `<div class="grid">${keys.map(k=>`<div class="card" data-col="${esc(k)}"><img src="${cols[k].img}" alt=""><div class="info"><div class="nm">${esc(k)}</div><div class="mu">${cols[k].n} шт. · ${cols[k].f} в продаже</div></div></div>`).join("") || `<div class="empty">Коллекций пока нет</div>`}</div>`;
  }
  app.innerHTML = tabs + add + body;
}

function renderProfile(){
  const ava = me.photo ? `<img src="${esc(me.photo)}" alt="">` : esc((me.name||"?")[0].toUpperCase());
  const head = `<div class="prof"><div class="ava">${ava}</div><div><div style="font-weight:800;font-size:17px">${esc(me.name)}</div><div class="mu">@${esc(me.username)}</div></div><button class="bl" id="bal" style="background:none">${bal()} ⭐ ＋</button></div>
  <div class="tabs"><button class="tab ${profTab==="assets"?"on":""}" data-pt="assets">Мои активы</button><button class="tab ${profTab==="deals"?"on":""}" data-pt="deals">Мои сделки</button></div>`;
  let body;
  if (profTab==="assets") {
    const mine = S.items.filter(i=>i.owner===me.username);
    body = `<div class="grid">${mine.map(i=>card(i,"mine")).join("") || `<div class="empty">У вас пока нет NFT</div>`}</div>`;
  } else {
    const d = S.deals.filter(x=>x.buyer===me.username||x.seller===me.username).slice().reverse();
    body = d.map(x=>{ const buy = x.buyer===me.username;
      return `<div class="row"><div><div class="nm">${buy?"Покупка":"Продажа"}: ${esc(x.name)}</div><div class="mu">${new Date(x.t).toLocaleString("ru-RU")} · ${buy?"у @"+esc(x.seller):"@"+esc(x.buyer)}</div></div><b style="color:${buy?"var(--err)":"var(--ok)"}">${buy?"−":"+"}${x.price} ⭐</b></div>`;
    }).join("") || `<div class="empty">Сделок пока нет</div>`;
  }
  const demo = tgUser ? "" : `<div style="padding:14px"><button class="btn sec" id="switchU">Демо: сменить пользователя</button></div>`;
  return head + body + demo;
}

// ---------- Модалки ----------
function modal(html){ $("#modal").innerHTML = `<div class="modal" id="mbg"><div class="sheet">${html}</div></div>`; }
function closeM(){ $("#modal").innerHTML=""; }

function sellDialog(id){
  modal(`<div class="nm" style="font-size:17px">Цена в звёздах ⭐</div><input id="pr" type="number" min="1" inputmode="numeric" placeholder="Например, 100"><button class="btn" id="okSell">Выставить на продажу</button><button class="btn sec" id="cancel">Отмена</button>`);
  $("#okSell").onclick = () => { const p = Math.floor(+$("#pr").value); if(!(p>0)) return toast("Введите цену");
    const it = S.items.find(i=>i.id===id); if(!it||it.owner!==me.username) return; it.price=p; save(); closeM(); render(); toast("Выставлено в каталог"); };
  $("#cancel").onclick = closeM;
}

function addDialog(){
  if(!isOwner()) return toast("Нет прав");
  modal(`<div class="nm" style="font-size:17px">Новый NFT</div>
  <input type="file" id="f" accept="image/*">
  <input id="n" placeholder="Название">
  <input id="c" placeholder="Коллекция" list="cl"><datalist id="cl">${[...new Set(S.items.map(i=>i.collection))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <select id="r">${RAR.map(r=>`<option>${r}</option>`).join("")}</select>
  <input id="num" placeholder="Номер (например, 1)" inputmode="numeric">
  <input id="p" type="number" min="1" placeholder="Цена в ⭐">
  <button class="btn" id="ok">Создать и выставить</button><button class="btn sec" id="cancel">Отмена</button>`);
  $("#cancel").onclick = closeM;
  $("#ok").onclick = async () => {
    const f=$("#f").files[0], n=$("#n").value.trim(), c=$("#c").value.trim(), num=$("#num").value.trim(), p=Math.floor(+$("#p").value);
    if(!f||!n||!c||!num||!(p>0)) return toast("Заполните все поля");
    const img = await shrink(f);
    S.items.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:n, collection:c, rarity:$("#r").value, number:num, img, owner:OWNER, price:p });
    save(); closeM(); render(); toast("NFT добавлен");
  };
}

function shrink(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=600, k=Math.min(1,m/Math.max(im.width,im.height)); const cv=document.createElement("canvas"); cv.width=im.width*k; cv.height=im.height*k; cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.82)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

function buy(id){
  const it = S.items.find(i=>i.id===id); if(!it||it.price==null) return toast("Лот недоступен");
  if(it.owner===me.username) return toast("Это ваш лот");
  if(bal()<it.price) return toast("Недостаточно звёзд");
  const seller = it.owner; S.users[me.username]-=it.price;
  S.users[seller]=(S.users[seller]||0)+it.price;
  S.deals.push({ t:Date.now(), name:`${it.name} #${it.number}`, price:it.price, buyer:me.username, seller });
  it.owner=me.username; it.price=null; save(); render(); toast("Покупка успешна!");
}

// ---------- События ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-buy],[data-sell],[data-unlist],[data-mt],[data-pt],[data-col],#profBtn,#addNft,#clr,#switchU,#mbg,#bal,[data-amt]"); if(!t) return;
  if (t.id==="mbg") { if(e.target.id==="mbg") closeM(); return; }
  if (t.id==="profBtn") { view = view==="profile"?"main":"profile"; render(); }
  else if (t.id==="bal") topupMenu();
  else if (t.dataset.amt) startTopup(+t.dataset.amt);
  else if (t.id==="addNft") addDialog();
  else if (t.id==="clr") { colFilter=null; render(); }
  else if (t.id==="switchU") { const u=(prompt("Юзернейм (без @). Для прав владельца: marvel")||"").trim().toLowerCase().replace("@",""); if(u){ me={username:u,name:u,photo:null}; render(); } }
  else if (t.dataset.buy) buy(t.dataset.buy);
  else if (t.dataset.sell) sellDialog(t.dataset.sell);
  else if (t.dataset.unlist) { const it=S.items.find(i=>i.id===t.dataset.unlist); if(it&&it.owner===me.username){ it.price=null; save(); render(); } }
  else if (t.dataset.mt) { mainTab=t.dataset.mt; render(); }
  else if (t.dataset.pt) { profTab=t.dataset.pt; render(); }
  else if (t.dataset.col) { colFilter=t.dataset.col; mainTab="catalog"; render(); }
});
// ---------- Синхронизация баланса с клиентом ----------
function setExt(v){ v=Number(v); if (isFinite(v)) { ext=Math.max(0,Math.floor(v)); render(); } }
function pullBalance(){
  try { const u=tgUser||{}; if (u.balance!=null) setExt(u.balance); else if (u.stars!=null) setExt(u.stars); } catch(e){}
  try { const p=new URLSearchParams(location.hash.slice(1)+"&"+location.search.slice(1)); const v=p.get("balance")||p.get("stars"); if (v!=null) setExt(v); } catch(e){}
  try { const c=window.TelegramClient; if (c && c.getBalance) Promise.resolve(c.getBalance()).then(setExt).catch(()=>{}); } catch(e){}
}
window.addEventListener("message", e => { try { const o=typeof e.data==="string"?JSON.parse(e.data):e.data;
  if (o && (o.type==="balance" || o.eventType==="balance_changed")) setExt(o.value ?? o.balance ?? (o.eventData && o.eventData.balance)); } catch(x){} });
document.addEventListener("visibilitychange", () => { if (!document.hidden) pullBalance(); });
// ---------- Пополнение баланса через чек ----------
const BOT_API = "https://api.telegram.org"; // адрес Bot API ВАШЕГО клиента (если у него свой сервер ботов), без / на конце
const BOT_TOKEN = ""; // токен бота от @BotFather: чек отправляется прямо из приложения, без сервера (только для теста!)
const API_URL = "https://nft-server2.onrender.com"; // адрес вашего сервера бота, например https://bot.example.com (без / на конце)  // // адрес вашего бэкенда: POST {amount,user,initData} -> {invoice_link} (необязательно)

function topupMenu(){
  modal(`<div class="nm" style="font-size:17px">Пополнить баланс</div>
  <div class="mu">Баланс в боте: ${bal()} ⭐. Бот пришлёт чек, после его оплаты звёзды спишутся с баланса клиента и зачислятся сюда.</div>
  <div style="display:flex;gap:8px"><button class="btn sec" data-amt="250">250 ⭐</button><button class="btn sec" data-amt="500">500 ⭐</button><button class="btn sec" data-amt="1000">1000 ⭐</button></div>
  <button class="btn sec" id="custom">Своя сумма</button>
  <div id="cw" class="hide" style="display:flex;flex-direction:column;gap:8px"><input id="ca" type="number" min="1" inputmode="numeric" placeholder="Введите сумму"><button class="btn" id="cgo">Пополнить</button></div>
  <button class="btn sec" id="cancel">Закрыть</button>`);
  $("#cancel").onclick = closeM;
  $("#custom").onclick = () => { $("#cw").classList.remove("hide"); $("#custom").classList.add("hide"); $("#ca").focus(); };
  $("#cgo").onclick = () => startTopup(Math.floor(+$("#ca").value));
}

async function startTopup(a){
  if (!(a>=1 && a<=100000)) return toast("Введите сумму от 1 до 100000");
  closeM(); toast("Бот отправляет чек…");
  const req = { amount:a, user:me.username, initData:(tg && tg.initData) || "" };
  try {
    const c = window.TelegramClient;
    if (c && c.requestCheck) { await c.requestCheck(a); return; }      // клиент сам просит бота прислать чек
    if (API_URL) {
      const r = await fetch(API_URL + "/api/invoice", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ amount:a, initData:(tg && tg.initData) || "", userId:uKey() }) });
      const j = await r.json();
      if (!j.ok) return toast(j.error || "Не удалось создать счёт", 6000);
      if (!(tg && tg.openInvoice)) return toast("Клиент не поддерживает оплату", 6000);
      tg.openInvoice(j.link, st => { if (st === "paid") { toast("Оплачено, зачисляем…"); watchBalance(); } else if (st === "failed") toast("Оплата не прошла", 5000); });
      return;
    }
    if (BOT_TOKEN) { await sendCheckDirect(a); return; }
    if (tg && tg.sendData) { tg.sendData(JSON.stringify({ action:"topup", amount:a })); return; }  // бот получает запрос и шлёт чек
  } catch(e){ return toast("Ошибка: " + (e && e.message || e), 7000); }
  toast("Клиент пока не поддерживает чеки");
}

function creditTopup(a, id){
  a = Math.floor(+a); if (!(a>0)) return;
  S.topups = S.topups || [];
  if (id) { if (S.topups.includes(id)) return; S.topups.push(id); }   // защита от двойного зачисления
  S.users[me.username] = bal() + a; save(); render(); toast("Баланс пополнен на " + a + " ⭐");
}
window.onTopupPaid = (a, id) => creditTopup(a, id);                    // клиент может вызвать после оплаты чека
window.addEventListener("message", e => { try { const o = typeof e.data==="string" ? JSON.parse(e.data) : e.data;
  if (o && o.type==="topup_paid") creditTopup(o.amount, o.id); } catch(x){} });

// ---------- Чек напрямую через бота (без сервера; токен виден в коде!) ----------
const tgCall = (m, b) => fetch(BOT_API + "/bot" + BOT_TOKEN.trim().replace(/^bot/i,"") + "/" + m, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b) }).then(r => r.json());
async function sendCheckDirect(a){
  let uid = tgUser && tgUser.id;
  if (!uid) {
    try { uid = localStorage.getItem("npm_uid"); } catch(e){}
    if (!uid) {
      uid = (prompt("Клиент не передал ваш Telegram ID. Введите его (узнать можно у бота @userinfobot):") || "").trim();
      if (!/^\d+$/.test(uid)) return toast("Нужен числовой ID, только цифры", 5000);
      try { localStorage.setItem("npm_uid", uid); } catch(e){}
    }
    tgUser = tgUser || {}; tgUser.id = uid;
  }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  let r;
  try {
    r = await tgCall("sendMessage", { chat_id: uid, text: `🧾 Чек на пополнение\nСумма: ${a} ⭐\n\nНажмите кнопку, чтобы оплатить с баланса клиента.`,
      reply_markup: { inline_keyboard: [[{ text: `Оплатить ${a} ⭐`, callback_data: `pay:${id}:${a}` }]] } });
  } catch(e){ return toast("Нет связи с Telegram (" + e.message + "). Проверьте BOT_API: адрес должен быть сервером ботов вашего клиента", 8000); }
  if (!r.ok) {
    const d = r.description || "";
    const hint = /Unauthorized|not found/i.test(d) ? "Неверный токен бота (в файле: начало «" + BOT_TOKEN.trim().slice(0,6) + "…», длина " + BOT_TOKEN.trim().length + ")" : /initiate|blocked|chat not found/i.test(d) ? "Откройте чат с ботом и нажмите /start" : d;
    return toast("Ошибка Telegram: " + hint, 8000);
  }
  toast("Чек отправлен в чат с ботом"); listenPay();
}
let listening = false, upOff = 0;
async function listenPay(){
  if (listening) return; listening = true;
  while (listening) {
    try {
      const r = await tgCall("getUpdates", { offset: upOff, timeout: 25, allowed_updates: ["callback_query"] });
      for (const u of r.result || []) {
        upOff = u.update_id + 1; const q = u.callback_query;
        if (!q || !q.data || !q.data.startsWith("pay:")) continue;
        const [, id, amt] = q.data.split(":"); const a = +amt;
        const ans = (text, alert) => tgCall("answerCallbackQuery", { callback_query_id: q.id, text, show_alert: !!alert });
        if (String(q.from.id) !== String(tgUser && tgUser.id)) { ans("Это чужой чек"); continue; }
        if ((S.topups || []).includes(id)) { ans("Чек уже оплачен"); continue; }
        try { const c = window.TelegramClient; if (c && c.spendStars) await c.spendStars(a, "Пополнение NFT-рынка"); }
        catch(e){ ans("Недостаточно звёзд на балансе клиента", true); continue; }
        creditTopup(a, id); ans("Оплачено");
        tgCall("editMessageText", { chat_id: q.message.chat.id, message_id: q.message.message_id, text: `✅ Чек оплачен\nБаланс пополнен на ${a} ⭐` });
      }
    } catch(e){ await new Promise(r => setTimeout(r, 3000)); }
  }
}
if (BOT_TOKEN) listenPay();

// ---------- Чек внутри приложения (оплата через сервер) ----------
const uKey = () => String((tgUser && tgUser.id) || me.username);
function checkDialog(id, a){
  modal(`<div class="nm" style="font-size:17px">🧾 Чек на пополнение</div><div style="font-size:30px;font-weight:800;color:var(--st)">${a} ⭐</div>
  <div class="mu">Сумма спишется с баланса клиента и зачислится на баланс в боте.</div>
  <button class="btn" id="payBtn">Оплатить ${a} ⭐</button><button class="btn sec" id="cancel">Отмена</button>`);
  $("#cancel").onclick = closeM;
  $("#payBtn").onclick = async () => {
    const btn = $("#payBtn"); btn.disabled = true;
    try {
      const r = await fetch(API_URL + "/api/pay", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ id, userId:uKey() }) });
      const j = await r.json();
      if (!j.ok) { btn.disabled = false; return toast(j.error || "Оплата не прошла", 6000); }
      closeM(); await syncBalance();
    } catch(e){ btn.disabled = false; toast("Нет связи с сервером", 6000); }
  };
}

// ---------- Синхронизация пополнений с сервером бота ----------
async function syncBalance(){
  if (!API_URL) return;
  try {
    const r = await fetch(API_URL + "/api/balance?userId=" + encodeURIComponent(uKey()) + "&initData=" + encodeURIComponent((tg && tg.initData) || ""));
    const j = await r.json();
    S.synced = S.synced || {};
    const d = (j.total || 0) - (S.synced[me.username] || 0);
    if (d > 0) { S.synced[me.username] = j.total; S.users[me.username] = bal() + d; save(); render(); toast("Баланс пополнен на " + d + " ⭐"); }
  } catch(e){}
}
let wt; function watchBalance(){ clearInterval(wt); let n=0; wt=setInterval(()=>{ syncBalance(); if(++n>40) clearInterval(wt); },3000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncBalance(); });

syncBalance();
render();
</script>
